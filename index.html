<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IER - Acceso Privado</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #d4af37; --bg: #ffffff; --text: #1a1a1a; --accent: #f8f9fa; --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; }

        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0c; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--primary); }
        .login-box { text-align: center; padding: 40px; border: 1px solid #333; border-radius: 15px; background: #16161c; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-box h2 { margin-bottom: 25px; font-family: 'Cinzel', serif; letter-spacing: 3px; }
        .login-box input { padding: 12px; border-radius: 5px; border: 1px solid #444; text-align: center; width: 220px; margin-bottom: 20px; display: block; background: #1a1a1a; color: white; }
        .login-box button { padding: 12px 40px; cursor: pointer; background: var(--primary); border: none; border-radius: 5px; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        
        .hero-section { background: linear-gradient(135deg, #0a0a0c 0%, #1a1a1a 100%); height: 50vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; border-bottom: 4px solid var(--primary); }
        .logo-box { border: 2px solid var(--primary); padding: 15px 40px; margin-bottom: 20px; }
        .logo-text { font-family: 'Cinzel', serif; font-size: 3.5rem; color: #fff; letter-spacing: 8px; }
        .subtitle { color: var(--primary); font-weight: 400; letter-spacing: 4px; text-transform: uppercase; font-size: 0.9rem; }

        .about-card { background: linear-gradient(135deg, #0d0d11 0%, #16161c 100%); border: 1px solid #23232a; border-left: 4px solid var(--primary); border-radius: 16px; padding: 35px 40px; margin: 40px auto 10px auto; max-width: 900px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .about-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .about-title { font-size: 1.4rem; color: #ffffff; font-weight: 700; text-transform: uppercase; }
        .about-text { color: #c5c5ca; font-size: 1.1rem; max-width: 750px; font-weight: 300; line-height: 1.7; }
        
        .section-wrapper { width: 100%; padding: 80px 20px; }
        .section-wrapper.bg-alt { background-color: #f9f9f9; }
        .container { max-width: 900px; margin: 0 auto; }
        .section-title { font-size: 1.8rem; text-align: center; margin-bottom: 50px; font-weight: 700; }
        .section-title::after { content: ''; display: block; width: 40px; height: 3px; background: var(--primary); margin: 15px auto; }
        .main-intro { font-size: 1.5rem; font-weight: 600; text-align: center; margin-bottom: 30px; }
        .description-text { color: #555; text-align: justify; margin-bottom: 40px; }
        .highlight-box { background: var(--accent); border-left: 4px solid var(--primary); padding: 30px; font-style: italic; border-radius: 0 12px 12px 0; }

        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .card { background: #fff; padding: 35px 20px; border: 1px solid #eee; border-radius: 12px; transition: var(--transition); text-align: center; }
        .card i { font-size: 2.5rem; color: var(--primary); margin-bottom: 15px; display: block; }
        
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .platform-card { background: #ffffff; border: 1px solid #eee; padding: 40px; border-radius: 16px; text-align: center; }
        .brand-logo-poly { color: #004BFF; font-weight: 800; font-size: 1.4rem; }
        .brand-logo-kalshi { color: #049a74; font-weight: 800; font-size: 1.4rem; }

        .platform-block { margin-bottom: 45px; }
        .platform-label { text-align: center; font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; text-transform: uppercase; }
        .direct-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
        .btn { padding: 12px 30px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: var(--transition); display: inline-block; cursor: pointer; }
        .btn-dark { background: #1a1a1a; color: #fff; }
        .btn-kalshi { background: #049a74; color: #fff; }

        .final-doc-section { background: #1a1a1a; color: #fff; text-align: center; border-radius: 20px; padding: 60px 40px; margin: 40px auto; max-width: 900px; }
        .cta-button { display: inline-block; padding: 18px 40px; background: var(--primary); color: #000; border-radius: 50px; font-weight: 700; text-decoration: none; margin-top: 25px; }
        
        .final-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 50px; }
        .final-link { padding: 15px; border: 1px solid #eaeaea; border-radius: 8px; text-decoration: none; color: #333; font-weight: 500; display: block; text-align: center; background: #fff; }

        .gemini-section { background: linear-gradient(135deg, #0f1115 0%, #1a1d24 100%); border: 1px solid #2d323f; border-left: 4px solid #4285f4; border-radius: 16px; padding: 40px; margin: 60px auto 20px auto; max-width: 900px; text-align: center; }
        .gemini-title { font-size: 1.6rem; color: #ffffff; margin-bottom: 20px; }
        .btn-gemini-web { background: #4285f4; color: #ffffff; }

        .main-footer { background-color: #0d0d0f; color: #56565c; padding: 40px 20px; text-align: center; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2>ACCESO IER</h2>
            <input type="password" id="passInput" placeholder="Introduce clave...">
            <button onclick="checkPass()">Entrar</button>
        </div>
    </div>

    <script>
        // Verificación de sesión al abrir
        window.onload = function() {
            if (sessionStorage.getItem("acceso_concedido") === "true") {
                document.getElementById("login-overlay").style.display = "none";
            }
        };

        function checkPass() {
            var pass = document.getElementById("passInput").value;
            var secret = "Q2FubmVz"; 
            if (btoa(pass) === secret) { 
                sessionStorage.setItem("acceso_concedido", "true");
                document.getElementById("login-overlay").style.display = "none";
            } else {
                alert("Contraseña incorrecta.");
            }
        }

        // Función para abrir enlaces externamente en Chrome
        function openExternal(url) {
            window.open(url, '_system');
        }
    </script>

    <div id="app-content">
        <header class="hero-section">
            <div class="logo-box"><span class="logo-text">IER</span></div>
            <h1 class="subtitle">Semi-Arbitraje en Predicciones de Entretenimiento</h1>
        </header>

        <div class="section-wrapper bg-alt">
            <section class="container">
                <h2 class="section-title">Acceso Directo</h2>
                <div class="platform-block">
                    <p class="platform-label" style="color: #004BFF;">Polymarket</p>
                    <div class="direct-container">
                        <a href="#" onclick="openExternal('https://polymarket.com/es/pop-culture/movies')" class="btn btn-dark">Películas</a>
                        <a href="#" onclick="openExternal('https://polymarket.com/es/pop-culture/reality-tv')" class="btn btn-dark">Televisión</a>
                    </div>
                </div>
                <div class="platform-block">
                    <p class="platform-label" style="color: #049a74;">Kalshi</p>
                    <div class="direct-container">
                        <a href="#" onclick="openExternal('https://kalshi.com/category/culture/movies')" class="btn btn-kalshi">Películas</a>
                        <a href="#" onclick="openExternal('https://kalshi.com/category/culture')" class="btn btn-kalshi">Streaming</a>
                    </div>
                </div>
            </section>
        </div>

        <div class="container"><div class="final-doc-section"><h2>Recursos</h2><a href="#" onclick="openExternal('https://drive.google.com/drive/folders/1I_6qVQNPadinEIFzYxV5jx1bIHM_M4lD')" class="cta-button">Ver Drive ↗</a></div></div>

        <footer class="main-footer"><p>&copy; 2026 IER. Todos los derechos reservados.</p></footer>
    </div>
</body>
</html>
